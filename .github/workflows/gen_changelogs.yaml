name: Gen changelogs

on:
  workflow_dispatch:

jobs:
  gen-changelog-16:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Get Date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Install python dependencies
        run: pip install gql[aiohttp] httpx --break-system-packages

      - name: Gen changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: "16"
          START_DATE: "2026-04-01"
        run: python .github/scripts/main.py

      - name: Commit to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit_message: "chore: gen changelog (branch 16) as per ${{ steps.date.outputs.date }}"
          file_pattern: "changelogs/source.txt"

  gen-changelog-17:
    needs: gen-changelog-16
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Get Date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Install python dependencies
        run: pip install gql[aiohttp] httpx --break-system-packages

      - name: Gen changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: "17"
          START_DATE: "2026-06-01"
        run: python .github/scripts/main.py

      - name: Commit to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit_message: "chore: gen changelog (branch 17) as per ${{ steps.date.outputs.date }}"
          file_pattern: "changelogs/source.txt"